<style>
:root{--bg:#f4f1ec;--card:#fff;--border:#e2ddd5;--text:#1c1917;--text2:#78716c;--text3:#a8a29e;--red:#b91c1c;--brown:#6b3a1f;--accent:#b45309;--accent2:#d97706;--green:#15803d;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer}

/* NAV */
.nav{background:#292524;padding:12px 24px;display:flex;align-items:center;gap:16px}
.nav h1{color:#fef3c7;font-size:18px;font-weight:700;letter-spacing:-.5px}
.nav-btn{color:#d6d3d1;font-size:13px;font-weight:500;background:none;border:none;padding:6px 12px;border-radius:6px;transition:all .15s}
.nav-btn:hover,.nav-btn.on{color:#fef3c7;background:rgba(255,255,255,.1)}
.nav-btn.on{font-weight:700}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.sync{font-size:11px;color:#86efac;font-weight:500;display:flex;align-items:center;gap:5px}
.sync .d{width:5px;height:5px;border-radius:50%;background:#86efac}

/* HOME */
.home{max-width:900px;margin:0 auto;padding:32px 20px}
.today-card{background:var(--card);border-radius:16px;padding:32px;border:1px solid var(--border);margin-bottom:24px}
.today-card .date{font-size:28px;font-weight:800;color:var(--brown);letter-spacing:-.5px}
.today-card .sub{font-size:14px;color:var(--text2);margin-top:4px}
.today-card .stats{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap}
.stat{background:var(--bg);padding:12px 20px;border-radius:10px;min-width:100px}
.stat .n{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--text)}
.stat .l{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.today-card .actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{padding:10px 22px;border-radius:10px;border:none;font-size:14px;font-weight:600;transition:all .15s}
.btn-main{background:var(--accent);color:#fff}.btn-main:hover{background:var(--accent2)}
.btn-outline{background:none;border:1.5px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:#bbb;background:var(--bg)}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:7px}

.section-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}

.day-list{display:flex;flex-direction:column;gap:8px}
.day-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);border-radius:10px;border:1px solid var(--border);transition:border-color .15s;flex-wrap:wrap;gap:8px;cursor:pointer}
.day-row:hover{border-color:#c5bfb5}
.day-row .info{flex:1}
.day-row .d-date{font-weight:700;font-size:14px}
.day-row .d-shops{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.d-tag{font-size:11px;color:var(--text2);background:var(--bg);padding:2px 8px;border-radius:4px;font-weight:500}
.d-tag b{color:var(--text)}
.day-row .d-total{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--brown);min-width:55px;text-align:center}
.day-row .d-btns{display:flex;gap:6px}
.day-row .d-btns button{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);font-size:11px;font-weight:600;color:var(--text2)}
.day-row .d-btns button:hover{background:var(--bg);color:var(--text)}

/* MODAL */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:16px;padding:28px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:18px;font-weight:700;margin-bottom:6px}
.modal p{font-size:13px;color:var(--text2);margin-bottom:20px}
.modal .opts{display:flex;flex-direction:column;gap:8px}
.modal .opt{padding:14px 18px;border:1.5px solid var(--border);border-radius:10px;background:none;text-align:left;transition:all .15s;font-size:14px;font-weight:500}
.modal .opt:hover{border-color:var(--accent);background:#fffbeb}
.modal .opt .small{font-size:11px;color:var(--text3);margin-top:2px}

.editor-bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.editor-bar .ed-date{font-size:16px;font-weight:700;color:var(--brown)}
.editor-bar .ed-total{margin-left:auto;font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent)}

.ed-actions{padding:8px 20px;background:var(--card);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ed-actions input,.ed-actions select{padding:5px 10px;border-radius:6px;border:1px solid var(--border);font-size:12px;font-family:inherit}
.add-bar{padding:10px 20px;background:#ecfdf5;border-bottom:1px solid #bbf7d0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.add-bar input{flex:1;min-width:140px;padding:6px 10px;border-radius:6px;border:1px solid #86efac;font-size:13px;font-weight:600;font-family:inherit}
.add-bar select{padding:6px 10px;border-radius:6px;border:1px solid #86efac;font-size:12px;font-family:inherit}

table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#292524;color:#fef3c7;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:9px 6px;text-align:center;white-space:nowrap}
th:first-child{text-align:left;padding-left:16px;min-width:180px;position:sticky;left:0;z-index:10;background:#292524}
td{padding:4px 6px;border-bottom:1px solid var(--border);text-align:center;height:34px}
td:first-child{text-align:left;padding-left:16px;font-weight:600;color:var(--red);font-size:12px;position:sticky;left:0;background:var(--card);z-index:5;border-right:1px solid var(--border)}
td.tc{font-weight:700;color:var(--brown);background:#fefce8;font-family:var(--mono);font-size:13px}
tr:hover td{background:#fafaf5}
tr:hover td:first-child{background:#fafaf5}
tr:hover td.tc{background:#fef9c3}
tfoot td{background:#292524!important;color:#fef3c7;font-weight:700;font-size:13px;padding:9px 6px;font-family:var(--mono)}
tfoot td:first-child{background:#292524!important;color:#fef3c7;font-family:'Outfit',sans-serif}
.cell{display:flex;align-items:center;justify-content:center;gap:1px}
.val{min-width:24px;padding:2px 4px;border-radius:3px;cursor:pointer;font-family:var(--mono);font-size:13px}
.val:hover{background:#fef3c7}
.val.z{color:#d4d4d4}
.pm{width:16px;height:20px;border:none;background:none;font-size:12px;font-weight:800;border-radius:3px;opacity:.25;transition:opacity .15s}
.pm:hover{opacity:1}
.ci{width:50px;padding:3px;text-align:center;border:2px solid var(--accent);border-radius:5px;font-size:13px;font-weight:600;font-family:var(--mono);outline:none;background:#fffbeb}

.toast{position:fixed;bottom:20px;right:20px;padding:10px 20px;border-radius:8px;color:#fff;font-weight:600;font-size:13px;z-index:9999;animation:fu .3s ease}
@keyframes fu{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.loading{display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:12px;color:var(--text2)}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--text3);font-size:14px}

@media print{.nav,.editor-bar,.ed-actions,.add-bar,.pm,.no-print{display:none!important}th:first-child,td:first-child{position:static}}
</style>
</head>

  const [toast,setToast]=useState(null);
  const [hf,setHf]=useState({from:"",to:""});
  const iR=useRef(null);const aR=useRef(null);const sT=useRef(null);const lR=useRef(null);const sk=useRef(false);

  useEffect(()=>{if(ec&&iR.current)iR.current.focus()},[ec]);
  useEffect(()=>{if(showAdd&&aR.current)aR.current.focus()},[showAdd]);
  const flash=(m,c)=>{setToast({m,c});setTimeout(()=>setToast(null),2500)};

  const attach=dk=>{if(lR.current)lR.current();const ref=db.ref("days/"+dk);const h=ref.on("value",s=>{if(sk.current){sk.current=false;return}const d=s.val();if(d)setProds(d)});lR.current=()=>ref.off("value",h)};

  // Initial load
  useEffect(()=>{(async()=>{try{setHist(await fbA());setOnline(true)}catch(e){setOnline(false)}setLoading(false)})();return()=>{if(lR.current)lR.current()}},[]);

  // Auto-save when editing
  useEffect(()=>{if(page!=="editor"||loading)return;if(sT.current)clearTimeout(sT.current);sT.current=setTimeout(async()=>{setSyncing(true);try{sk.current=true;await fbS(cur,prods);setHist(p=>({...p,[cur]:prods}))}catch(e){flash("Kayıt başarısız","#dc2626")}setSyncing(false)},800);return()=>clearTimeout(sT.current)},[prods,cur,page,loading]);

  // Open a day for editing
  const openDay=async(dk)=>{
    setLoading(true);setCur(dk);
    const d=await fbL(dk).catch(()=>null);
    if(d){setProds(d);attach(dk);setPage("editor");setLoading(false);return}
    // New day — show modal
    const allDates=Object.keys(hist).sort();
    if(allDates.length>0){
      setModal({date:dk,sources:allDates.reverse()});
      setLoading(false);
    } else {
      setProds(bFirst());attach(dk);setPage("editor");setLoading(false);
    }
  };

  const modalPick=async(choice)=>{
    const dk=modal.date;setModal(null);setLoading(true);
    if(choice==="blank"){setProds(blank())}
    else{const src=hist[choice];if(src)setProds(JSON.parse(JSON.stringify(src)));else setProds(blank())}
    setCur(dk);attach(dk);setPage("editor");setLoading(false);
  };

  const goHome=async()=>{setPage("home");setShowAdd(false);setSearch("");try{setHist(await fbA())}catch(e){}};

  const delDay=async dk=>{if(!confirm(fmt(dk)+" silinsin mi?"))return;try{await fbD(dk);setHist(p=>{const n={...p};delete n[dk];return n});flash("Silindi","#78716c")}catch(e){}};

  // Editor functions
  const uv=useCallback((pid,sid,v)=>{setProds(p=>p.map(x=>x.id===pid?{...x,vals:{...x.vals,[sid]:Math.max(0,parseInt(v)||0)}}:x))},[]);
  const rm=useCallback(id=>{if(!confirm("Sil?"))return;setProds(p=>p.filter(x=>x.id!==id))},[]);
  const add=useCallback(()=>{if(!nn.trim())return;const e={};SH.forEach(s=>e[s.id]=0);setProds(p=>[...p,{id:Date.now(),name:nn.trim().toUpperCase(),cat:nc,vals:e}]);setNn("");setShowAdd(false)},[nn,nc]);
  const fp=prods.filter(p=>!search||p.name.toLowerCase().includes(search.toLowerCase()));
  const cT=sid=>fp.reduce((s,p)=>s+(p.vals[sid]||0),0);
  const gT=SH.reduce((s,sh)=>s+cT(sh.id),0);
  const cc=(pid,sid,cv)=>{setEc(`${pid}-${sid}`);setEv(String(cv||0))};
  const cb=(pid,sid)=>{uv(pid,sid,ev);setEc(null)};
  const ck=(e,pid,sid)=>{if(e.key==="Enter")cb(pid,sid);if(e.key==="Escape")setEc(null)};
  const inc=(pid,sid,d)=>{setProds(p=>p.map(x=>x.id===pid?{...x,vals:{...x.vals,[sid]:Math.max(0,(x.vals[sid]||0)+d)}}:x))};

  const hDates=Object.keys(hist).sort().reverse();
  const fhDates=hDates.filter(dk=>{if(hf.from&&dk<hf.from)return false;if(hf.to&&dk>hf.to)return false;return true});

  const todayExists=!!hist[td()];
  const todaySum=todayExists?dSum(hist,td()):{shops:[],total:0};

  if(loading)return<div className="loading"><div className="spin"></div>Yükleniyor...</div>;

  return(<div>
    {toast&&<div className="toast" style={{background:toast.c}}>{toast.m}</div>}

    {/* MODAL: New Day Choice */}
    {modal&&<div className="modal-bg" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <h2>{fmt(modal.date)}</h2>
      <p>Bu gün için kayıt yok. Nasıl başlamak istersin?</p>
      <div className="opts">
        <button className="opt" onClick={()=>modalPick("blank")}>
          <div>📄 Boş liste ile başla</div>
          <div className="small">Tüm değerler sıfır</div>
        </button>
        {modal.sources.map(d=>{const sm=dSum(hist,d);return<button key={d} className="opt" onClick={()=>modalPick(d)}>
          <div>📋 {fmt(d)} kopyala</div>
          <div className="small">{sm.total} adet · {sm.shops.length} şube</div>
        </button>})}
      </div>
    </div></div>}

    {/* NAV */}
    <div className="nav">
      <h1>🥯 Sipariş Takip</h1>
      <button className={`nav-btn ${page==="home"?"on":""}`} onClick={goHome}>Ana Sayfa</button>
      {page==="editor"&&<button className="nav-btn on">Düzenleme</button>}
      <div className="nav-right">
        <div className="sync"><span className="d" style={{background:syncing?"#fbbf24":online?"#86efac":"#fca5a5"}}></span>{syncing?"Kaydediliyor...":online?"Senkron":"Çevrimdışı"}</div>
      </div>
    </div>

    {/* ════════ HOME ════════ */}
    {page==="home"&&<div className="home">
      {/* Today Card */}
      <div className="today-card" style={{cursor:"pointer"}} onDoubleClick={()=>openDay(td())}>
        <div className="date">{fmt(td())}</div>
        <div className="sub">{todayExists?"Bugünün kaydı mevcut":"Bugün için henüz kayıt yok"}</div>
        {todayExists&&<div className="stats">
          <div className="stat"><div className="n">{todaySum.total}</div><div className="l">Toplam</div></div>
          {todaySum.shops.slice(0,4).map(s=><div key={s.id} className="stat"><div className="n">{s.total}</div><div className="l">{s.name}</div></div>)}
        </div>}
        <div className="actions">
          <button className="btn btn-main" onClick={()=>openDay(td())}>{todayExists?"Bugünü Düzenle":"Bugünü Oluştur"}</button>
          <span style={{position:"relative",display:"inline-block"}}><button className="btn btn-outline" onClick={()=>document.getElementById("datepick").showPicker()}>Başka Gün Aç</button><input id="datepick" type="date" style={{position:"absolute",bottom:0,left:0,width:1,height:1,opacity:0,pointerEvents:"none"}} onChange={e=>{if(e.target.value)openDay(e.target.value)}}/></span>
          <button className="btn btn-outline" onClick={()=>{if(makeAllExcel(hist,SH))flash("Aktarıldı","var(--accent)");else flash("Kayıt yok","#f59e0b")}}>📊 Tüm Geçmişi Excel</button>
        </div>
      </div>

      {/* Date filter */}
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:16,flexWrap:"wrap"}}>
        <div className="section-title" style={{margin:0}}>Geçmiş Kayıtlar ({fhDates.length})</div>
        <div style={{marginLeft:"auto",display:"flex",gap:6,alignItems:"center"}}>
          <input type="date" value={hf.from} onChange={e=>setHf(f=>({...f,from:e.target.value}))} style={{padding:"4px 8px",borderRadius:6,border:"1px solid var(--border)",fontSize:12,fontFamily:"inherit"}}/>
          <span style={{color:"var(--text3)"}}>—</span>
          <input type="date" value={hf.to} onChange={e=>setHf(f=>({...f,to:e.target.value}))} style={{padding:"4px 8px",borderRadius:6,border:"1px solid var(--border)",fontSize:12,fontFamily:"inherit"}}/>
        </div>
      </div>

      {fhDates.length===0?<div className="empty">Henüz kayıt yok. Bugünü oluşturarak başla!</div>
      :<div className="day-list">{fhDates.map(dk=>{
        const sm=dSum(hist,dk);const pr=hist[dk];
        return<div key={dk} className="day-row" onDoubleClick={()=>openDay(dk)}>
          <div className="info">
            <div className="d-date">{fmt(dk)}</div>
            <div className="d-shops">{sm.shops.map(s=><span key={s.id} className="d-tag">{s.name}: <b>{s.total}</b></span>)}</div>
          </div>
          <div className="d-total">{sm.total}</div>
          <div className="d-btns">
            <button onClick={()=>openDay(dk)}>Düzenle</button>
            <button onClick={()=>{if(pr&&Array.isArray(pr)){makeExcel(pr,SH,fmt(dk),"Siparis_"+dk+".xlsx");flash("İndirildi","var(--accent)")}}}>📥 Excel</button>
            <button style={{color:"var(--red)"}} onClick={()=>delDay(dk)}>Sil</button>
          </div>
        </div>
      })}</div>}
    </div>}

    {/* ════════ EDITOR ════════ */}
    {page==="editor"&&<>
      <div className="editor-bar">
        <button className="btn btn-sm btn-outline no-print" onClick={goHome}>← Geri</button>
        <div className="ed-date">{fmt(cur)}</div>
        <button className="btn btn-sm btn-outline no-print" onClick={()=>{makeExcel(prods,SH,fmt(cur),"Siparis_"+cur+".xlsx");flash("İndirildi","var(--accent)")}}>📥 Excel</button>
        <button className="btn btn-sm btn-outline no-print" onClick={()=>window.print()}>🖨</button>
        <div className="ed-total">Toplam: {prods.reduce((s,p)=>s+rT(p),0)}</div>
      </div>
      <div className="ed-actions no-print">
        <input type="text" placeholder="Ürün ara..." value={search} onChange={e=>setSearch(e.target.value)} style={{width:150}}/>
        <button className={`btn btn-sm ${showAdd?"btn-outline":"btn-main"}`} style={showAdd?{color:"var(--red)"}:{}} onClick={()=>setShowAdd(!showAdd)}>{showAdd?"İptal":"+ Yeni Ürün"}</button>
        <button className="btn btn-sm btn-outline" onClick={()=>{if(confirm("Tüm değerler sıfırlansın mı?")){setProds(p=>p.map(x=>({...x,vals:Object.fromEntries(SH.map(s=>[s.id,0]))})));flash("Sıfırlandı","#78716c")}}}>Sıfırla</button>
      </div>
      {showAdd&&<div className="add-bar no-print">
        <input ref={aR} type="text" placeholder="Ürün adı..." value={nn} onChange={e=>setNn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
        <select value={nc} onChange={e=>setNc(e.target.value)}>{CATS.map(c=><option key={c}>{c}</option>)}</select>
        <button className="btn btn-sm btn-main" onClick={add}>Ekle</button>
      </div>}
      <div style={{overflowX:"auto"}}>
        <table>
          <thead><tr>
            <th>Ürün Adı</th>
            {SH.map(s=><th key={s.id}>{s.name}</th>)}
            <th>Toplam</th>
            <th className="no-print" style={{width:32,minWidth:32}}></th>
          </tr></thead>
          <tbody>{fp.map(p=>{
            const tot=rT(p);
            return<tr key={p.id}>
              <td>{p.name}</td>
              {SH.map(s=>{
                const key=`${p.id}-${s.id}`,v=p.vals[s.id]||0,ed=ec===key;
                return<td key={s.id} style={{borderLeft:"1px solid var(--border)"}}>
                  {ed?<input ref={iR} type="number" min="0" className="ci" value={ev} onChange={e=>setEv(e.target.value)} onBlur={()=>cb(p.id,s.id)} onKeyDown={e=>ck(e,p.id,s.id)}/>
                  :<div className="cell">
                    <button className="pm no-print" style={{color:"#dc2626"}} onClick={()=>inc(p.id,s.id,-1)}>−</button>
                    <span className={`val ${v===0?"z":""}`} onClick={()=>cc(p.id,s.id,v)}>{v>0?v:"·"}</span>
                    <button className="pm no-print" style={{color:"var(--green)"}} onClick={()=>inc(p.id,s.id,1)}>+</button>
                  </div>}
                </td>
              })}
              <td className="tc">{tot>0?tot:""}</td>
              <td className="no-print"><button onClick={()=>rm(p.id)} style={{border:"none",background:"none",cursor:"pointer",color:"#d4d4d4",fontSize:12}} onMouseEnter={e=>e.currentTarget.style.color="#dc2626"} onMouseLeave={e=>e.currentTarget.style.color="#d4d4d4"}>✕</button></td>
            </tr>
          })}</tbody>
          <tfoot><tr>
            <td>TOPLAM</td>
            {SH.map(s=><td key={s.id}>{cT(s.id)||""}</td>)}
            <td style={{color:"#fbbf24",fontSize:15}}>{gT}</td>
            <td className="no-print"></td>
          </tr></tfoot>
        </table>
      </div>
      <div style={{padding:"16px 20px",display:"flex",justifyContent:"center",gap:12}} className="no-print">
        <button className="btn btn-main" style={{padding:"12px 40px",fontSize:15}} onClick={async()=>{setSyncing(true);try{sk.current=true;await fbS(cur,prods);setHist(p=>({...p,[cur]:prods}));flash("Kaydedildi!","var(--green)")}catch(e){flash("Hata!","#dc2626")}setSyncing(false)}}>💾 Kaydet</button>
        <button className="btn btn-outline" onClick={goHome}>← Ana Sayfaya Dön</button>
      </div>
    </>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
